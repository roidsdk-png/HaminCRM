upstream hamin_socialcrm {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    server_name crm.haminyar.ir;
    server_tokens off;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        proxy_pass http://hamin_socialcrm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crm.haminyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.haminyar.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.haminyar.ir;
    server_tokens off;
    return 301 https://$host$request_uri;
}
